<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>dock mock</title>
<style>:root { --dsh-composer-side-clearance: 16px; --dsh-composer-stack-gap: 6px; }
* { box-sizing: border-box; }
body { margin: 0; background: #14161a; color: #c8ccd4; font-family: system-ui, 'Segoe UI', sans-serif; font-size: 13px; }
.stage { --dsh-chat-content-width: min(calc(100% - 32px), 920px); --dsh-composer-card-max-width: min(calc(100% - 16px), 952px); --dsh-composer-side-clearance: 16px; --dsh-composer-dock-inset: 8px; }
.composerStack { --dsh-composer-stack-gap: 6px; gap: var(--dsh-composer-stack-gap); flex-direction: column; display: flex; }
.root { padding: 0 var(--dsh-composer-side-clearance) 4px; flex-direction: column; align-items: center; display: flex; }
.dock { justify-content: center; align-items: center; gap: 12px; max-width: 100%; padding-top: 4px; display: flex; }
.card { box-sizing: border-box; width: 100%; max-width: var(--dsh-composer-card-max-width); display: flex; flex-direction: column; gap: 12px; padding-top: 8px; border: 1px solid #2c313a; border-radius: 12px; background: #1d2027; }
.cardInner { height: 44px; display: flex; align-items: center; justify-content: center; color: #7f8794; }
.meter { flex: none; display: inline-flex; }
.meter > button { font-size: 13px; line-height: 20px; white-space: nowrap; padding: 1px 8px; display: inline-flex; flex: none; background: transparent; border: 0; color: #9aa0aa; font-family: inherit; }
.slot { display: contents; }
.label { position: fixed; left: 8px; top: 4px; font-size: 11px; color: #6b7280; }</style>
<style>
/* 兜底（不依赖 JS）：把 dock 行宽收敛到输入框卡片，并允许换行。
   dock 自带的 max-width:100% 参照 root（窗口减侧边留白）而不是卡片，所以会比输入框宽；
   必须显式给 width —— 只设 max-width 不够：换行 flex 容器的 max-content 会缩成最宽一项。 */
div:has(> [data-slot='conversation.composer.dock']) {
  width: min(100%, var(--dsh-composer-card-max-width, 100%));
  flex-wrap: wrap;
}
.dsm-wrap {
  /* 独占一行：宿主统计行 order 默认 0，本插件 order 1 → 排在统计行下方 */
  flex: 1 0 100%;
  order: 1;
  /* dock 的 gap 是 12px，吃掉 8px，免得两行之间看起来空了一行 */
  margin: -8px 0 0;
  display: block;
  min-width: 0;
  box-sizing: border-box;
}
.dsm-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  column-gap: 10px;
  row-gap: 2px;
  width: 100%;
  margin: 0;
  padding: 0; /* v7: 与 dock 的 row-gap 叠加会显得空一行 */
  border: none;
  background: transparent;
  font: inherit;
  font-size: 12px;
  line-height: 20px;
  color: var(--dsw-alias-label-tertiary, #9aa0aa);
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  text-align: center;
}
.dsm-bar:hover {
  color: var(--dsw-alias-label-secondary, #c8ccd4);
}
.dsm-seg {
  display: inline-block;
  white-space: nowrap;
}
/* 固定段宽：数字位数变化（1% ↔ 100%）不引起整条伸缩 */
.dsm-fixed-cpu,
.dsm-fixed-mem {
  min-width: 5.6em;
}
.dsm-fixed-gpu {
  min-width: 14em;
}
.dsm-fixed-vram {
  /* 22.00/24.00 两位小数，中英文标签最宽约 8.6em */
  min-width: 8.8em;
}
.dsm-fixed-pwr,
.dsm-fixed-temp {
  min-width: 3em;
}
.dsm-sep {
  color: var(--dsw-alias-border-l3, rgba(0, 0, 0, 0.25));
}
.dsm-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-weight: 600;
  /* 固定宽：中英文本长度差异大（空闲 ↔ bandwidth-bound），
     状态切换不引起整条伸缩 */
  min-width: 8.8em;
}
.dsm-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 12%, transparent);
}
.dsm-panel {
  margin: 4px auto 0;
  max-width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--dsw-alias-border-l2, rgba(0, 0, 0, 0.12));
  border-radius: 10px;
  background: var(--dsw-alias-bg-layer-1, #ffffff);
  font-size: 12px;
  color: var(--dsw-alias-label-primary, #1a1d24);
  color-scheme: light dark;
}
.dsm-panel-title {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--dsw-alias-label-secondary, #5b6472);
}
.dsm-panel-empty {
  padding: 6px 0;
  color: var(--dsw-alias-label-tertiary, #9aa0aa);
}
.dsm-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.dsm-table th,
.dsm-table td {
  padding: 4px 10px;
  text-align: left;
  border-bottom: 1px solid var(--dsw-alias-border-l2, rgba(0, 0, 0, 0.08));
  white-space: nowrap;
}
.dsm-table th {
  font-weight: 500;
  color: var(--dsw-alias-label-tertiary, #9aa0aa);
}
.dsm-table .dsm-num {
  text-align: right;
}
.dsm-close {
  margin-top: 8px;
  padding: 4px 14px;
  border: 1px solid var(--dsw-alias-border-l2, rgba(0, 0, 0, 0.12));
  border-radius: 6px;
  background: transparent;
  color: var(--dsw-alias-label-secondary, #5b6472);
  font-size: 12px;
  cursor: pointer;
}
.dsm-close:hover {
  border-color: var(--dsw-alias-label-secondary, #5b6472);
}</style>
</head><body>
<div class="stage"><div class="composerStack"><div class="root">
  <div class="card" data-composer-card="true"><div class="cardInner">输入框卡片（input card）</div></div>
  <div class="dock" id="dock">
    <div class="slot" data-slot="conversation.composer.dock">
      <div class="dsm-wrap" id="wrap"><button class="dsm-bar" id="bar" type="button">
        <span class="dsm-seg dsm-fixed-cpu">CPU 23%</span>
        <span class="dsm-seg dsm-fixed-mem">内存 61%</span>
        <span class="dsm-sep" aria-hidden="true">│</span>
        <span class="dsm-seg dsm-fixed-gpu">GPU SM 37% 带宽 82%</span>
        <span class="dsm-seg dsm-fixed-vram">显存 21.35/24.00G</span>
        <span class="dsm-seg dsm-fixed-pwr">功耗 292W</span>
        <span class="dsm-seg dsm-fixed-temp">温度 71C</span>
        <span class="dsm-badge"><span class="dsm-dot"></span>带宽受限</span>
      </button></div>
    </div>
    <span class="meter"><button type="button">上下文占用 12% · 24K / 200K</button></span>
  </div>
</div></div></div>
<script>//#region src/client/align.ts
		/**
		* Dock-row alignment for the system bar.
		*
		* DSH renders the conversation.composer.dock slot as:
		*
		*   <div class="…_dock">                           <- 真实布局行（flex row / gap 12px / max-width:100%）
		*     <div data-slot="…" style="display:contents"> <- 槽位包装：没有盒子，clientWidth = 0
		*       <div class="dsm-wrap">…</div>              <- 本插件根节点
		*     <span class="…ContextMeter">                 <- 宿主统计项
		*   </div>
		*
		* 包装层是 display:contents，width / flex-wrap 打在它上面无效，必须往上找到第一个
		* display !== 'contents' 且 clientWidth > 0 的真实行；行宽也不能靠 max-width:100%
		* （它参照 root，不是输入框卡片），得拿卡片当量尺显式设 width。
		*
		* @module dsh-system-monitor-xg/client/align
		*/
		/** 往上找第一个真实布局行（跳过 display:contents 的槽位包装）。 */
		function realRow(el) {
			let node = el.parentElement;
			for (let hops = 0; node !== null && hops < 12; hops += 1) {
				if (node === document.body || node === document.documentElement) return null;
				if (getComputedStyle(node).display !== "contents" && node.clientWidth > 0) return node;
				node = node.parentElement;
			}
			return null;
		}
		/** 量尺：同层兄弟里最宽的那个（DSH 输入框卡片带 data-composer-card）。 */
		function measureCard(row) {
			const parent = row.parentElement;
			if (parent === null) return 0;
			const card = parent.querySelector(":scope > [data-composer-card]");
			if (card !== null) return card.getBoundingClientRect().width;
			let widest = 0;
			for (const sib of parent.children) {
				if (sib === row) continue;
				const w = sib.getBoundingClientRect().width;
				if (w > widest) widest = w;
			}
			return widest;
		}
		/** 行宽 = 卡片宽；允许换行；被截断的宿主统计项折行显示全（不要省略号）。 */
		function alignDockRow(el) {
			const row = realRow(el);
			if (row === null) return null;
			const cardW = measureCard(row);
			if (cardW > 0) row.style.width = `${cardW}px`;
			row.style.maxWidth = "100%";
			row.style.flexWrap = "wrap";
			let wrapped = 0;
			for (const child of row.children) {
				if (child === el || child.contains(el)) continue;
				if (child.scrollWidth > child.clientWidth + 1) {
					child.style.flexWrap = "wrap";
					wrapped += 1;
				} else if (child.style.flexWrap !== "") child.style.flexWrap = "";
			}
			return {
				row,
				cardW,
				rowW: row.getBoundingClientRect().width,
				wrapped
			};
		}
		</script>
<script>function metrics(tag) {
  const card = document.querySelector('[data-composer-card]');
  const dock = document.getElementById('dock');
  const wrap = document.getElementById('wrap');
  const bar = document.getElementById('bar');
  const cr = card.getBoundingClientRect(), dr = dock.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  const kids = [...bar.children].map((el) => el.getBoundingClientRect());
  const tops = new Set(kids.map((r) => Math.round(r.top)));
  const barLeft = Math.min(...kids.map((r) => r.left));
  const barRight = Math.max(...kids.map((r) => r.right));
  const clip = [...bar.children].filter((el) => el.scrollWidth > el.clientWidth + 1).length;
  const dockOverflow = [...dock.children].reduce((n, el) => {
    const r = el.getBoundingClientRect();
    return n + (r.right > dr.right + 0.5 || r.left < dr.left - 0.5 ? 1 : 0);
  }, 0);
  return {
    tag, vw: window.innerWidth,
    cardW: +cr.width.toFixed(1), cardL: +cr.left.toFixed(1), cardR: +cr.right.toFixed(1),
    dockW: +dr.width.toFixed(1), dockL: +dr.left.toFixed(1), dockR: +dr.right.toFixed(1),
    wrapW: +wr.width.toFixed(1), wrapL: +wr.left.toFixed(1), wrapR: +wr.right.toFixed(1),
    barL: +barLeft.toFixed(1), barR: +barRight.toFixed(1),
    lines: tops.size, wrapInCard: barLeft >= cr.left - 0.5 && barRight <= cr.right + 0.5,
    dockInCard: dr.left >= cr.left - 0.5 && dr.right <= cr.right + 0.5,
    dockOverflow, clip,
  };
}
window.__run = (mismatch) => {
  const out = {};
  out.before = metrics('before');
  if (mismatch) document.getElementById('dock').style.width = (document.getElementById('dock').getBoundingClientRect().width) + 'px';
  alignDockRow(document.getElementById('wrap'));
  out.after = metrics('after');
  return out;
};</script>
</body></html>
